[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3shift"
version = "0.1.0"
description = "A truly serverless Redshift on your own AWS account: Redshift SQL on DuckDB in a Lambda, over your S3 and RDS data, ≈ $0 when idle. redshift_connector API: from s3shift import redshift_connector."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "redshift", "duckdb", "s3", "data-warehouse", "sql", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = []  # standard library only (pandas only for fetch_dataframe)

[project.urls]
Homepage = "https://github.com/cloudformer/s3shift"
Repository = "https://github.com/cloudformer/s3shift"
Deploy = "https://github.com/cloudformer/s3shift#quick-start"
Compatibility = "https://github.com/cloudformer/s3shift/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/s3shift/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/s3shift/issues"

[tool.setuptools]
packages = ["s3shift"]
